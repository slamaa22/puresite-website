<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/puresite-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PureSite | High-End Webdesign & Softwareentwicklung aus der Steiermark</title>
    <meta name="description" content="Modulare, rasend schnelle Websites ohne WordPress-Ballast. Transparente Modul-Preise & Live-Demos für jedes Feature." />

    <!-- Resource Preconnects -->
    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preload" as="image" href="/assets/hero-showcase.webp" type="image/webp" fetchpriority="high">

    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=JetBrains+Mono:wght@500;700&family=Outfit:wght@600;800&display=swap">
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
